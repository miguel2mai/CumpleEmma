<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emma - El Cumpleaños de nuestra K-pop Monster Hunter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow-x: hidden;
        }

        .font-royal {
            font-family: 'Cinzel', serif;
        }

        /* Animación de fondo (Crossfade entre las dos imágenes) */
        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 3s ease-in-out, transform 10s linear;
        }

        .bg-slide.active {
            opacity: 0.3; /* Ajustado para que el texto sea más legible */
            transform: scale(1.05);
        }

        /* Efecto Cristal (Glassmorphism) */
        .glass-panel {
            background: rgba(20, 10, 30, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        /* Texto con gradiente y brillo */
        .text-glow {
            text-shadow: 0 0 20px rgba(219, 39, 119, 0.8), 0 0 40px rgba(147, 51, 234, 0.6);
        }

        .gradient-text {
            background: linear-gradient(to right, #fbcfe8, #d8b4fe, #fbcfe8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s infinite linear;
            background-size: 200% auto;
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        /* Animación de latido para elementos adorables */
        .animate-heartbeat {
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Estilos para el contador */
        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 90px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 640px) {
            .time-block {
                width: 100px;
                height: 110px;
            }
        }

        .time-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* Canvas de celebración (oculto hasta el cumple) */
        #celebration-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative">

    <div class="bg-slideshow">
        <div class="bg-slide active" style="background-image: url('image.png');" id="slide1"></div>
        <div class="bg-slide" style="background-image: url('image_2.png');" id="slide2"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-purple-900/50 to-black/90"></div>
    </div>

    <!-- Lienzo para confeti y fuegos artificiales -->
    <canvas id="celebration-canvas"></canvas>

    <main class="relative z-10 w-full max-w-4xl px-4 py-8 mx-auto flex flex-col items-center text-center">
        
        <div class="glass-panel rounded-3xl p-8 sm:p-12 w-full flex flex-col items-center transform transition-all duration-700 hover:scale-[1.02]">
            
            <!-- Encabezado adorador -->
            <div class="mb-4 text-purple-300 font-medium tracking-[0.2em] uppercase text-sm sm:text-base flex items-center gap-3">
                <span class="w-8 h-[1px] bg-purple-400/50"></span>
                <span>Preparando el mundo para</span>
                <span class="w-8 h-[1px] bg-purple-400/50"></span>
            </div>

            <h1 class="font-royal text-6xl sm:text-7xl md:text-8xl font-black mb-6 text-glow gradient-text drop-shadow-2xl">
                EMMA
            </h1>
            
            <!-- Galería tipo "Photocard" K-pop -->
            <div class="flex gap-6 mb-10 justify-center">
                <div class="w-28 h-28 sm:w-40 sm:h-40 rounded-full overflow-hidden border-4 border-purple-500/40 shadow-[0_0_30px_rgba(168,85,247,0.5)] animate-heartbeat hover:scale-110 transition-transform duration-300" style="animation-delay: 0s;">
                    <img src="image.png" alt="Emma Dibujo" class="w-full h-full object-cover object-center">
                </div>
                <div class="w-28 h-28 sm:w-40 sm:h-40 rounded-full overflow-hidden border-4 border-pink-500/40 shadow-[0_0_30px_rgba(236,72,153,0.5)] animate-heartbeat hover:scale-110 transition-transform duration-300" style="animation-delay: 1s;">
                    <img src="image_2.png" alt="Emma K-pop" class="w-full h-full object-cover object-top">
                </div>
            </div>

            <!-- Mensaje de cuenta atrás -->
            <h2 class="text-lg sm:text-xl text-gray-300 mb-6 font-medium tracking-wide">
                TIEMPO RESTANTE PARA SU GRAN DÍA
            </h2>

            <div id="countdown-container" class="flex flex-wrap justify-center gap-3 sm:gap-6 w-full">
                <!-- Días -->
                <div class="time-block group">
                    <span id="days" class="text-3xl sm:text-5xl font-bold text-white group-hover:scale-110 transition-transform">00</span>
                    <span class="text-xs sm:text-sm text-purple-300 uppercase mt-1 tracking-wider">Días</span>
                </div>
                <!-- Horas -->
                <div class="time-block group">
                    <span id="hours" class="text-3xl sm:text-5xl font-bold text-white group-hover:scale-110 transition-transform">00</span>
                    <span class="text-xs sm:text-sm text-pink-300 uppercase mt-1 tracking-wider">Horas</span>
                </div>
                <!-- Minutos -->
                <div class="time-block group">
                    <span id="minutes" class="text-3xl sm:text-5xl font-bold text-white group-hover:scale-110 transition-transform">00</span>
                    <span class="text-xs sm:text-sm text-purple-300 uppercase mt-1 tracking-wider">Min.</span>
                </div>
                <!-- Segundos -->
                <div class="time-block group">
                    <span id="seconds" class="text-3xl sm:text-5xl font-bold text-pink-400 group-hover:scale-110 transition-transform text-glow">00</span>
                    <span class="text-xs sm:text-sm text-pink-300 uppercase mt-1 tracking-wider">Seg.</span>
                </div>
            </div>

            <!-- Mensaje de celebración (Oculto por defecto) -->
            <div id="celebration-message" class="hidden flex-col items-center justify-center mt-6">
                <h2 class="font-royal text-4xl sm:text-5xl text-yellow-400 font-bold mb-4 animate-pulse drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]">
                    ¡ES HOY! ¡ES HOY!
                </h2>
                <p class="text-xl text-white font-medium">¡Feliz Cumpleaños Emma!</p>
            </div>

            <!-- Pie de tarjeta -->
            <div class="mt-12 text-gray-300 text-lg sm:text-xl font-medium flex items-center justify-center gap-3 drop-shadow-md">
                <span>Nuestra K-pop Monster Hunter</span> 
                <span class="animate-pulse text-purple-400 text-2xl">💜</span>
            </div>

        </div>
    </main>

    <script>
        // --- 1. Lógica del Slideshow de Fondo ---
        const slide1 = document.getElementById('slide1');
        const slide2 = document.getElementById('slide2');
        let currentSlide = 1;

        setInterval(() => {
            if (currentSlide === 1) {
                slide1.classList.remove('active');
                slide2.classList.add('active');
                currentSlide = 2;
            } else {
                slide2.classList.remove('active');
                slide1.classList.add('active');
                currentSlide = 1;
            }
        }, 5000); // Cambia de imagen cada 5 segundos

        // --- 2. Lógica de la Cuenta Atrás ---
        function updateCountdown() {
            const now = new Date();
            let targetYear = now.getFullYear();
            
            // Su cumpleaños es el 23 de Septiembre a las 00:00
            let targetDate = new Date(`September 23, ${targetYear} 00:00:00`);

            // Si hoy es su cumpleaños (dentro de las 24 horas del día 23), mostramos celebración
            const isBirthday = now.getMonth() === 8 && now.getDate() === 23; // getMonth es 0-indexado (8 = Septiembre)
            
            // Si ya pasó su cumpleaños este año, apuntamos al año que viene
            if (now.getTime() > targetDate.getTime() && !isBirthday) {
                targetYear++;
                targetDate = new Date(`September 23, ${targetYear} 00:00:00`);
            }

            const difference = targetDate.getTime() - now.getTime();

            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const countdownContainer = document.getElementById('countdown-container');
            const celebrationMessage = document.getElementById('celebration-message');

            if (isBirthday || difference <= 0) {
                // ¡ES SU CUMPLEAÑOS!
                countdownContainer.classList.add('hidden');
                celebrationMessage.classList.remove('hidden');
                celebrationMessage.classList.add('flex');
                startCelebration();
                return;
            }

            // Cálculos matemáticos de tiempo
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Formateo visual (añadir ceros a la izquierda)
            daysEl.innerText = days.toString().padStart(2, '0');
            hoursEl.innerText = hours.toString().padStart(2, '0');
            minutesEl.innerText = minutes.toString().padStart(2, '0');
            secondsEl.innerText = seconds.toString().padStart(2, '0');
        }

        // Actualizamos cada segundo
        setInterval(updateCountdown, 1000);
        updateCountdown(); // Llamada inicial

        let celebrationStarted = false;
        function startCelebration() {
            if (celebrationStarted) return;
            celebrationStarted = true;
            
            const canvas = document.getElementById('celebration-canvas');
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#fbcfe8', '#d8b4fe', '#f472b6', '#a855f7', '#fbbf24']; // Tonos rosados, púrpuras y dorados

            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    speedY: Math.random() * 3 + 2,
                    speedX: Math.random() * 2 - 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                particles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += p.rotationSpeed;
                    
                    // Reposicionar arriba si cae del todo
                    if (p.y > canvas.height) {
                        p.y = -20;
                        p.x = Math.random() * canvas.width;
                    }

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    
                    // Dibujar estrellas o confeti rectangular
                    if(Math.random() > 0.5) {
                        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size/2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                });
                
                requestAnimationFrame(animate);
            }
            animate();

            // Ajustar canvas al cambiar tamaño de ventana
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
    </script>
</body>
</html>
